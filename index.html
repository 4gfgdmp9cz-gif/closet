<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#111111">

<title>My Closet</title>

<style>
:root{
  --bg:#111111;
  --text:#ffffff;
  --card:rgba(30,30,30,.90);
  --sub:#aaaaaa;
  --accent:#ff6b57;
  --border:#444444;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
  min-height:100vh;
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}

.overlay{
  min-height:100vh;
  background:rgba(0,0,0,.15);
}

header{
  position:sticky;
  top:0;
  z-index:50;
  backdrop-filter:blur(15px);
  background:rgba(15,15,15,.84);
  border-bottom:1px solid var(--border);
}

.header-inner{
  max-width:700px;
  margin:auto;
  padding:
    calc(10px + env(safe-area-inset-top))
    14px
    12px;
}

h1{
  margin:0;
  font-size:26px;
}

.subtitle{
  margin-top:3px;
  color:#bbbbbb;
  font-size:13px;
}

main{
  max-width:700px;
  margin:auto;
  padding:14px 12px 100px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:14px;
  margin-bottom:14px;
  backdrop-filter:blur(10px);
}

h2{
  font-size:19px;
  margin:0 0 12px;
}

label{
  display:block;
  margin:10px 0 5px;
  font-size:14px;
  font-weight:700;
}

input,
select,
textarea,
button{
  width:100%;
  font-size:16px;
}

input,
select,
textarea{
  background:#202020;
  color:white;
  border:1px solid #555;
  border-radius:12px;
  padding:12px;
}

textarea{
  min-height:80px;
}

button{
  border:0;
  border-radius:13px;
  padding:13px 10px;
  font-weight:800;
  cursor:pointer;
  margin-top:8px;
}

.primary{
  background:var(--accent);
  color:white;
}

.secondary{
  background:#333333;
  color:white;
}

.danger{
  background:#7d2020;
  color:white;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.filter-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.search{
  margin-bottom:9px;
}

.count{
  color:var(--sub);
  font-size:13px;
  margin-top:8px;
}

.item{
  background:rgba(25,25,25,.94);
  border:1px solid #444;
  border-radius:16px;
  overflow:hidden;
  margin-bottom:12px;
}

.item img{
  width:100%;
  max-height:400px;
  object-fit:contain;
  background:#000;
  display:block;
}

.item-info{
  padding:12px;
}

.item-name{
  font-size:19px;
  font-weight:800;
  margin-bottom:5px;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-bottom:7px;
}

.tag{
  background:#3a3a3a;
  border-radius:20px;
  padding:5px 9px;
  font-size:12px;
}

.memo{
  color:#cccccc;
  white-space:pre-wrap;
  font-size:14px;
}

.small{
  color:#aaaaaa;
  font-size:12px;
}

.preview{
  width:100%;
  max-height:260px;
  object-fit:contain;
  border-radius:12px;
  background:#000;
  margin-top:8px;
  display:none;
}

.color-row{
  display:grid;
  grid-template-columns:1fr 60px;
  gap:8px;
}

.color-row input[type=color]{
  padding:3px;
  height:48px;
}

hr{
  border:0;
  border-top:1px solid #444;
  margin:16px 0;
}

canvas{
  width:100%;
  border-radius:14px;
  background:#111;
  touch-action:none;
}

.range-row{
  margin:10px 0;
}

.range-row input{
  padding:0;
}

.notice{
  font-size:13px;
  color:#bbbbbb;
  line-height:1.55;
}

.hidden{
  display:none !important;
}

#toast{
  position:fixed;
  z-index:999;
  left:50%;
  bottom:
    calc(20px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  max-width:90%;
  background:#ffffff;
  color:#111;
  border-radius:30px;
  padding:10px 18px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

#toast.show{
  opacity:1;
}

.tabs{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:5px;
  margin-bottom:14px;
}

.tab{
  background:#292929;
  color:white;
  padding:10px 3px;
  font-size:13px;
}

.tab.active{
  background:var(--accent);
}

@media(max-width:400px){
  .grid2,
  .filter-grid{
    grid-template-columns:1fr;
  }

  .tabs{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

上

その他

<script>

const DB_NAME =
  "myClosetDB";

const DB_VERSION = 1;

let db;

let items = [];

let personImage = null;
let clothingImage = null;



function openDB(){

  return new Promise(
    (resolve,reject)=>{

    const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );

    request.onupgradeneeded =
      e=>{

      const database =
        e.target.result;

      if(
        !database.objectStoreNames
        .contains("items")
      ){

        database.createObjectStore(
          "items",
          {
            keyPath:"id"
          }
        );

      }

      if(
        !database.objectStoreNames
        .contains("settings")
      ){

        database.createObjectStore(
          "settings",
          {
            keyPath:"key"
          }
        );

      }

    };

    request.onsuccess =
      e=>{

      db =
        e.target.result;

      resolve(db);

    };

    request.onerror =
      ()=>reject(
        request.error
      );

  });

}



function getStore(
  name,
  mode="readonly"
){

  const tx =
    db.transaction(
      name,
      mode
    );

  return tx.objectStore(name);

}



async function loadItems(){

  return new Promise(
    (resolve,reject)=>{

    const req =
      getStore("items")
      .getAll();

    req.onsuccess =
      ()=>{

      items =
        req.result || [];

      items.sort(
        (a,b)=>
          (b.createdAt || "")
          .localeCompare(
            a.createdAt || ""
          )
      );

      renderItems();

      updateOverlayChoices();

      resolve();

    };

    req.onerror =
      ()=>reject(req.error);

  });

}



async function putItem(item){

  return new Promise(
    (resolve,reject)=>{

    const req =
      getStore(
        "items",
        "readwrite"
      )
      .put(item);

    req.onsuccess =
      ()=>resolve();

    req.onerror =
      ()=>reject(req.error);

  });

}



async function removeItem(id){

  return new Promise(
    (resolve,reject)=>{

    const req =
      getStore(
        "items",
        "readwrite"
      )
      .delete(id);

    req.onsuccess =
      ()=>resolve();

    req.onerror =
      ()=>reject(req.error);

  });

}



function uid(){

  if(
    crypto &&
    crypto.randomUUID
  ){

    return crypto.randomUUID();

  }

  return (
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2)
  );

}



function toast(msg){

  const el =
    document.getElementById(
      "toast"
    );

  el.textContent = msg;

  el.classList.add("show");

  setTimeout(
    ()=>{
      el.classList.remove(
        "show"
      );
    },
    2200
  );

}



function showPage(
  page,
  button
){

  document
    .querySelectorAll(
      "main > section"
    )
    .forEach(
      el=>
        el.classList.add(
          "hidden"
        )
    );

  document
    .getElementById(
      "page-" + page
    )
    .classList.remove(
      "hidden"
    );

  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      el=>
        el.classList.remove(
          "active"
        )
    );

  button.classList.add(
    "active"
  );

  window.scrollTo(
    {
      top:0,
      behavior:"smooth"
    }
  );

}



document
.getElementById("photo")
.addEventListener(
  "change",
  async e=>{

  if(
    !e.target.files[0]
  ) return;

  const data =
    await imageToCompressedDataURL(
      e.target.files[0],
      1000,
      .8
    );

  const preview =
    document.getElementById(
      "photoPreview"
    );

  preview.src = data;
  preview.style.display =
    "block";

});



async function imageToCompressedDataURL(
  file,
  maxSize=1000,
  quality=.8
){

  return new Promise(
    (resolve,reject)=>{

    const img =
      new Image();

    const reader =
      new FileReader();

    reader.onload =
      ev=>{
        img.src =
          ev.target.result;
      };

    reader.onerror =
      reject;

    img.onload =
      ()=>{

      let w =
        img.width;

      let h =
        img.height;

      if(
        w > maxSize ||
        h > maxSize
      ){

        const ratio =
          Math.min(
            maxSize / w,
            maxSize / h
          );

        w *= ratio;
        h *= ratio;

      }

      const canvas =
        document.createElement(
          "canvas"
        );

      canvas.width =
        Math.round(w);

      canvas.height =
        Math.round(h);

      const ctx =
        canvas.getContext(
          "2d"
        );

      ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
      );

      resolve(
        canvas.toDataURL(
          "image/jpeg",
          quality
        )
      );

    };

    reader.readAsDataURL(
      file
    );

  });

}



async function saveItem(){

  const name =
    document
    .getElementById("name")
    .value
    .trim();

  if(!name){

    toast(
      "名前を入力してね"
    );

    return;

  }

  let photo = "";

  const file =
    document
    .getElementById("photo")
    .files[0];

  if(file){

    photo =
      await imageToCompressedDataURL(
        file,
        1000,
        .8
      );

  }

  const item = {

    id:uid(),

    name:name,

    season:
      document
      .getElementById("season")
      .value,

    type:
      document
      .getElementById("type")
      .value,

    brand:
      document
      .getElementById("brand")
      .value
      .trim(),

    color:
      document
      .getElementById(
        "itemColor"
      )
      .value
      .trim(),

    memo:
      document
      .getElementById("memo")
      .value
      .trim(),

    photo:photo,

    createdAt:
      new Date()
      .toISOString()

  };

  await putItem(item);

  clearForm();

  await loadItems();

  toast(
    "保存したよ"
  );

}



function clearForm(){

  document
  .getElementById("name")
  .value = "";

  document
  .getElementById("brand")
  .value = "";

  document
  .getElementById("itemColor")
  .value = "";

  document
  .getElementById("memo")
  .value = "";

  document
  .getElementById("photo")
  .value = "";

  const preview =
    document.getElementById(
      "photoPreview"
    );

  preview.src = "";

  preview.style.display =
    "none";

}



function escapeHTML(str){

  return String(str || "")
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}



function renderItems(){

  const container =
    document.getElementById(
      "items"
    );

  if(!container) return;

  const search =
    (
      document
      .getElementById("search")
      .value || ""
    )
    .toLowerCase();

  const season =
    document
    .getElementById(
      "seasonFilter"
    )
    .value;

  const type =
    document
    .getElementById(
      "typeFilter"
    )
    .value;

  const filtered =
    items.filter(
      item=>{

      const text =
        [
          item.name,
          item.brand,
          item.color,
          item.memo,
          item.season,
          item.type
        ]
        .join(" ")
        .toLowerCase();

      if(
        search &&
        !text.includes(search)
      ){
        return false;
      }

      if(
        season &&
        item.season !== season
      ){
        return false;
      }

      if(
        type &&
        item.type !== type
      ){
        return false;
      }

      return true;

    }
  );

  document
  .getElementById(
    "itemCount"
  )
  .textContent =
    filtered.length +
    " 点";

  if(
    filtered.length === 0
  ){

    container.innerHTML =
      `
      <div class="card">
        まだ登録がないよ。
      </div>
      `;

    return;

  }

  container.innerHTML =
    filtered.map(
      item=>{

      const photoHTML =
        item.photo
        ?
        `
        <img
          src="${item.photo}"
          alt=""
        >
        `
        :
        "";

      return `
      <div class="item">

        ${photoHTML}

        <div class="item-info">

          <div class="item-name">
            ${escapeHTML(
              item.name
            )}
          </div>

          <div class="tags">

            <span class="tag">
              ${escapeHTML(
                item.season
              )}
            </span>

            <span class="tag">
              ${escapeHTML(
                item.type
              )}
            </span>

            ${
              item.color
              ?
              `
              <span class="tag">
                ${escapeHTML(
                  item.color
                )}
              </span>
              `
              :
              ""
            }

          </div>

          ${
            item.brand
            ?
            `
            <div class="small">
              ブランド：
              ${escapeHTML(
                item.brand
              )}
            </div>
            `
            :
            ""
          }

          ${
            item.memo
            ?
            `
            <div class="memo">
              ${escapeHTML(
                item.memo
              )}
            </div>
            `
            :
            ""
          }

          <button
            class="danger"
            onclick="
              deleteItem(
                '${item.id}'

function redrawComposite(){

  if(
    !personImage ||
    !clothingImage
  ){
    return;
  }

  const canvas =
    document
    .getElementById(
      "canvas"
    );

  const ctx =
    canvas.getContext(
      "2d"
    );

  const maxW =
    1000;

  const ratio =
    maxW /
    personImage.width;

  canvas.width =
    maxW;

  canvas.height =
    Math.round(
      personImage.height *
      ratio
    );

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.drawImage(
    personImage,
    0,
    0,
    canvas.width,
    canvas.height
  );

  const scale =
    Number(
      document
      .getElementById(
        "overlayScale"
      )
      .value
    ) / 100;

  const opacity =
    Number(
      document
      .getElementById(
        "overlayOpacity"
      )
      .value
    ) / 100;

  const offsetX =
    Number(
      document
      .getElementById(
        "overlayX"
      )
      .value
    );

  const offsetY =
    Number(
      document
      .getElementById(
        "overlayY"
      )
      .value
    );

  const targetW =
    canvas.width *
    scale;

  const imgRatio =
    clothingImage.height /
    clothingImage.width;

  const targetH =
    targetW *
    imgRatio;

  const x =
    (
      canvas.width -
      targetW
    ) / 2 +
    offsetX;

  const y =
    (
      canvas.height -
      targetH
    ) / 2 +
    offsetY;

  ctx.globalAlpha =
    opacity;

  ctx.drawImage(
    clothingImage,
    x,
    y,
    targetW,
    targetH
  );

  ctx.globalAlpha = 1;

}

}

function csvEscape(value){

  const s =
    String(
      value ?? ""
    );

  return (
    '"' +
    s.replace(
      /"/g,
      '""'
    ) +
    '"'
  );

}



function exportCSV(){

  const header = [
    "id",
    "name",
    "season",
    "type",
    "brand",
    "color",
    "memo",
    "createdAt"
  ];

  const rows =
    items.map(
      item=>
        header.map(
          key=>
            csvEscape(
              item[key]
            )
        )
        .join(",")
    );

  const csv =
    "\uFEFF" +
    header.join(",") +
    "\n" +
    rows.join("\n");

  downloadText(
    csv,
    "closet-backup.csv",
    "text/csv;charset=utf-8"
  );

}



function parseCSV(text){

  const rows = [];

  let row = [];
  let value = "";
  let quoted = false;

  for(
    let i=0;
    i<text.length;
    i++
  ){

    const c =
      text[i];

    if(quoted){

      if(c === '"'){

        if(
          text[i+1] === '"'
        ){

          value += '"';
          i++;

        }else{

          quoted = false;

        }

      }else{

        value += c;

      }

    }else{

      if(c === '"'){

        quoted = true;

      }else if(
        c === ","
      ){

        row.push(value);
        value = "";

      }else if(
        c === "\n"
      ){

        row.push(
          value.replace(
            /\r$/,
            ""
          )
        );

        rows.push(row);

        row = [];
        value = "";

      }else{

        value += c;

      }

    }

  }

  if(
    value.length ||
    row.length
  ){

    row.push(value);
    rows.push(row);

  }

  return rows;

}



async function importCSV(){

  const file =
    document
    .getElementById(
      "csvImport"
    )
    .files[0];

  if(!file){

    toast(
      "CSVを選んでね"
    );

    return;

  }

  const text =
    (await file.text())
    .replace(
      /^\uFEFF/,
      ""
    );

  const rows =
    parseCSV(text);

  if(
    rows.length < 2
  ){

    toast(
      "CSVにデータがないよ"
    );

    return;

  }

  const header =
    rows[0];

  let added = 0;
  let updated = 0;

  for(
    let i=1;
    i<rows.length;
    i++
  ){

    const row =
      rows[i];

    if(
      row.every(
        x=>!x.trim()
      )
    ){
      continue;
    }

    const obj = {};

    header.forEach(
      (key,index)=>{
        obj[key] =
          row[index] || "";
      }
    );

    const existing =
      obj.id
      ?
      items.find(
        x=>x.id === obj.id
      )
      :
      null;

    if(existing){

      const merged = {
        ...existing,
        ...obj,
        photo:
          existing.photo || ""
      };

      await putItem(
        merged
      );

      updated++;

    }else{

      obj.id =
        obj.id || uid();

      obj.photo = "";

      obj.createdAt =
        obj.createdAt ||
        new Date()
        .toISOString();

      await putItem(
        obj
      );

      added++;

    }

  }

  await loadItems();

  toast(
    "追加 " +
    added +
    "件 / 更新 " +
    updated +
    "件"
  );

}



function downloadText(
  content,
  filename,
  type
){

  const blob =
    new Blob(
      [content],
      {
        type:type
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const a =
    document.createElement(
      "a"
    );

  a.href = url;
  a.download = filename;
  a.click();

  setTimeout(
    ()=>URL.revokeObjectURL(
      url
    ),
    1000
  );

}

async function importJSON(){

  const file =
    document
    .getElementById(
      "jsonImport"
    )
    .files[0];

  if(!file){

    toast(
      "JSONを選んでね"
    );

    return;

  }

  let backup;

  try{

    backup =
      JSON.parse(
        await file.text()
      );

  }catch(e){

    toast(
      "JSONを読めなかった"
    );

    return;

  }

  if(
    !Array.isArray(
      backup.items
    )
  ){

    toast(
      "バックアップ形式が違うよ"
    );

    return;

  }

  for(
    const item of
    backup.items
  ){

    if(!item.id){

      item.id = uid();

    }

    await putItem(item);

  }

  if(
    backup.settings
  ){

    for(
      const [
        key,
        value
      ]
      of Object.entries(
        backup.settings
      )
    ){

      await saveSetting(
        key,
        value || ""
      );

    }

  }

  await loadItems();
  await loadSettings();

  toast(
    "バックアップを復元したよ"
  );

}

      ()=>reject(req.error);

  });

}
