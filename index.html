<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>MY CLOSET Ver.1</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Helvetica Neue",
  Arial,
  sans-serif;
  background:#0d0d0f;
  color:#fff;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  padding:
  calc(14px + env(safe-area-inset-top))
  16px 14px;
  background:
  rgba(13,13,15,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #29292f;
}

h1{
  margin:0;
  font-size:24px;
  letter-spacing:1px;
}

.sub{
  margin-top:4px;
  color:#999;
  font-size:12px;
}

main{
  max-width:700px;
  margin:auto;
  padding:14px;
  padding-bottom:
  calc(100px + env(safe-area-inset-bottom));
}

.controls{
  display:grid;
  gap:10px;
  margin-bottom:15px;
}

input,
select,
textarea,
button{
  width:100%;
  font-size:16px;
  border-radius:12px;
  border:1px solid #34343b;
}

input,
select,
textarea{
  padding:12px;
  background:#19191e;
  color:#fff;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  padding:13px;
  border:none;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#fff;
  color:#111;
}

.secondary{
  background:#24242a;
  color:#fff;
  border:1px solid #3a3a42;
}

.danger{
  background:#38191d;
  color:#ff9ca5;
}

.addBtn{
  position:fixed;
  z-index:20;
  right:18px;
  bottom:
  calc(20px + env(safe-area-inset-bottom));
  width:60px;
  height:60px;
  border-radius:50%;
  background:#fff;
  color:#111;
  font-size:32px;
  line-height:1;
  box-shadow:0 8px 30px #0008;
}

.grid{
  display:grid;
  grid-template-columns:
  repeat(2,minmax(0,1fr));
  gap:12px;
}

.card{
  overflow:hidden;
  background:#17171b;
  border:1px solid #2d2d33;
  border-radius:16px;
}

.photo{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  background:#24242a;
  display:block;
}

.noPhoto{
  width:100%;
  aspect-ratio:1/1;
  background:#24242a;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
}

.cardBody{
  padding:10px;
}

.brand{
  font-size:12px;
  color:#aaa;
  margin-bottom:3px;
}

.itemName{
  font-size:15px;
  font-weight:700;
  word-break:break-word;
}

.meta{
  font-size:12px;
  color:#aaa;
  margin-top:6px;
  line-height:1.6;
}

.cardActions{
  display:flex;
  gap:6px;
  margin-top:9px;
}

.cardActions button{
  padding:8px;
  font-size:12px;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  color:#777;
}

.modal{
  display:none;
  position:fixed;
  z-index:100;
  inset:0;
  overflow:auto;
  background:#000c;
  padding:
  calc(20px + env(safe-area-inset-top))
  12px
  calc(30px + env(safe-area-inset-bottom));
}

.modal.show{
  display:block;
}

.modalBox{
  max-width:600px;
  margin:auto;
  padding:18px;
  background:#121216;
  border:1px solid #34343b;
  border-radius:20px;
}

.modal h2{
  margin:0 0 16px;
}

.formGrid{
  display:grid;
  gap:10px;
}

label{
  font-size:13px;
  color:#aaa;
}

.preview{
  width:100%;
  max-height:320px;
  object-fit:contain;
  background:#1d1d22;
  border-radius:14px;
  display:none;
}

.sectionTitle{
  margin-top:8px;
  font-size:13px;
  color:#888;
  border-bottom:1px solid #29292e;
  padding-bottom:5px;
}

.topRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.count{
  color:#888;
  font-size:12px;
  margin:8px 2px 12px;
}

@media(max-width:390px){
  main{
    padding:10px;
  }

  .grid{
    gap:8px;
  }

  .cardBody{
    padding:8px;
  }
}
</style>
</head>

<body>

<header>
  <h1>MY CLOSET</h1>
  <div class="sub">
    Ver.1 ／ 服・アクセ・靴
  </div>
</header>

<main>

  <div class="controls">

    <input
      id="search"
      type="search"
      placeholder="ブランド・名前で検索">

    <div class="topRow">

      <select id="filterType">
        <option value="">
          すべての種類
        </option>
        <option value="服">服</option>
        <option value="アクセ">
          アクセ
        </option>
        <option value="靴">靴</option>
      </select>

      <select id="filterBrand">
        <option value="">
          すべてのブランド
        </option>
      </select>

    </div>
  </div>

  <div
    class="count"
    id="count">
  </div>

  <div
    class="grid"
    id="list">
  </div>

</main>

<button
  class="addBtn"
  id="addBtn"
  aria-label="追加">
  ＋
</button>

<div
  class="modal"
  id="modal">

  <div class="modalBox">

    <h2 id="formTitle">
      アイテム追加
    </h2>

    <div class="formGrid">

      <label>
        写真
      </label>

      <input
        id="photo"
        type="file"
        accept="image/*">

      <img
        id="preview"
        class="preview"
        alt="写真プレビュー">

      <label>
        種類
      </label>

      <select id="type">
        <option value="服">服</option>
        <option value="アクセ">
          アクセ
        </option>
        <option value="靴">靴</option>
      </select>

      <label>
        ブランド
      </label>

      <input
        id="brand"
        placeholder="例：Vivienne Westwood">

      <label>
        アイテム名
      </label>

      <input
        id="name"
        placeholder="例：ライダース">

      <label>
        サイズ
      </label>

      <input
        id="size"
        placeholder="例：M / 28cm">

      <label>
        購入価格
      </label>

      <input
        id="price"
        type="number"
        inputmode="numeric"
        placeholder="例：34100">

      <div class="sectionTitle">
        アクセサリー情報
      </div>

      <label>
        素材
      </label>

      <input
        id="material"
        placeholder="例：SILVER925">

      <label>
        長さ
      </label>

      <input
        id="length"
        placeholder="例：19cm">

      <label>
        重量
      </label>

      <input
        id="weight"
        placeholder="例：40g">

      <div class="sectionTitle">
        履歴・メモ
      </div>

      <label>
        修理・改造履歴
      </label>

      <textarea
        id="history"
        placeholder="例：フック交換、セーフティチェーン追加">
      </textarea>

      <label>
        メモ
      </label>

      <textarea
        id="memo"
        placeholder="購入場所・着用感など">
      </textarea>

      <button
        class="primary"
        id="saveBtn">
        保存
      </button>

      <button
        class="secondary"
        id="cancelBtn">
        キャンセル
      </button>

    </div>
  </div>
</div>

<script>

const STORAGE_KEY =
  "myClosetItemsV1";

let items =
  JSON.parse(
    localStorage.getItem(
      STORAGE_KEY
    ) || "[]"
  );

let editingId = null;
let photoData = "";

const $ = id =>
  document.getElementById(id);

const list =
  $("list");

const modal =
  $("modal");

function saveStorage(){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(items)
  );
}

function yen(value){
  if(!value) return "";
  return Number(value)
    .toLocaleString("ja-JP")
    + "円";
}

function escapeHtml(str){
  return String(str || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function updateBrands(){

  const current =
    $("filterBrand").value;

  const brands =
    [...new Set(
      items
        .map(x => x.brand)
        .filter(Boolean)
    )]
    .sort();

  $("filterBrand").innerHTML =
    `<option value="">
      すべてのブランド
    </option>` +
    brands.map(
      b =>
      `<option value="${escapeHtml(b)}">
        ${escapeHtml(b)}
      </option>`
    ).join("");

  if(brands.includes(current)){
    $("filterBrand").value =
      current;
  }
}

function render(){

  updateBrands();

  const word =
    $("search")
      .value
      .trim()
      .toLowerCase();

  const type =
    $("filterType").value;

  const brand =
    $("filterBrand").value;

  const filtered =
    items.filter(item => {

      const text =
        (
          item.brand + " " +
          item.name + " " +
          item.memo
        ).toLowerCase();

      return (
        (!word ||
          text.includes(word))
        &&
        (!type ||
          item.type === type)
        &&
        (!brand ||
          item.brand === brand)
      );

    });

  $("count").textContent =
    filtered.length +
    " 件";

  if(filtered.length === 0){

    list.innerHTML =
      `<div class="empty">
        まだ登録がありません。<br>
        右下の＋から追加できます。
      </div>`;

    return;
  }

  list.innerHTML =
    filtered
    .slice()
    .reverse()
    .map(item => {

      const photo =
        item.photo
        ?
        `<img
          class="photo"
          src="${item.photo}"
          alt="">`
        :
        `<div class="noPhoto">
          👕
        </div>`;

      let meta = "";

      if(item.size){
        meta +=
          `サイズ：
          ${escapeHtml(item.size)}
          <br>`;
      }

      if(item.price){
        meta +=
          `購入：
          ${yen(item.price)}
          <br>`;
      }

      if(item.material){
        meta +=
          `${escapeHtml(item.material)}
          <br>`;
      }

      if(item.length){
        meta +=
          `長さ：
          ${escapeHtml(item.length)}
          <br>`;
      }

      if(item.weight){
        meta +=
          `重量：
          ${escapeHtml(item.weight)}`;
      }

      return `
      <article class="card">

        ${photo}

        <div class="cardBody">

          <div class="brand">
            ${escapeHtml(item.brand)}
          </div>

          <div class="itemName">
            ${escapeHtml(
              item.name ||
              item.type
            )}
          </div>

          <div class="meta">
            ${meta}
          </div>

          <div class="cardActions">

            <button
              class="secondary"
              onclick="editItem(
                '${item.id}'
              )">
              編集
            </button>

            <button
              class="danger"
              onclick="deleteItem(
                '${item.id}'
              )">
              削除
            </button>

          </div>
        </div>
      </article>`;

    }).join("");
}

function resetForm(){

  editingId = null;
  photoData = "";

  $("formTitle").textContent =
    "アイテム追加";

  [
    "brand",
    "name",
    "size",
    "price",
    "material",
    "length",
    "weight",
    "history",
    "memo"
  ]
  .forEach(id => {
    $(id).value = "";
  });

  $("type").value = "服";
  $("photo").value = "";
  $("preview").src = "";
  $("preview").style.display =
    "none";
}

function openModal(){

  resetForm();

  modal.classList.add(
    "show"
  );

  document.body.style
    .overflow = "hidden";
}

function closeModal(){

  modal.classList.remove(
    "show"
  );

  document.body.style
    .overflow = "";
}

$("addBtn").onclick =
  openModal;

$("cancelBtn").onclick =
  closeModal;

$("photo").addEventListener(
  "change",
  event => {

    const file =
      event.target.files[0];

    if(!file) return;

    const reader =
      new FileReader();

    reader.onload = e => {

      photoData =
        e.target.result;

      $("preview").src =
        photoData;

      $("preview")
        .style.display =
        "block";
    };

    reader.readAsDataURL(file);
  }
);

$("saveBtn").onclick =
  () => {

    const existing =
      editingId
      ?
      items.find(
        x =>
        x.id === editingId
      )
      :
      null;

    const item = {

      id:
        editingId ||
        crypto.randomUUID(),

      type:
        $("type").value,

      brand:
        $("brand")
          .value.trim(),

      name:
        $("name")
          .value.trim(),

      size:
        $("size")
          .value.trim(),

      price:
        $("price").value,

      material:
        $("material")
          .value.trim(),

      length:
        $("length")
          .value.trim(),

      weight:
        $("weight")
          .value.trim(),

      history:
        $("history")
          .value.trim(),

      memo:
        $("memo")
          .value.trim(),

      photo:
        photoData ||
        existing?.photo ||
        "",

      updated:
        Date.now()
    };

    if(editingId){

      const index =
        items.findIndex(
          x =>
          x.id === editingId
        );

      items[index] = item;

    }else{

      items.push(item);

    }

    saveStorage();
    closeModal();
    render();
  };

window.editItem =
  function(id){

    const item =
      items.find(
        x =>
        x.id === id
      );

    if(!item) return;

    editingId = id;
    photoData =
      item.photo || "";

    $("formTitle").textContent =
      "アイテム編集";

    $("type").value =
      item.type || "服";

    $("brand").value =
      item.brand || "";

    $("name").value =
      item.name || "";

    $("size").value =
      item.size || "";

    $("price").value =
      item.price || "";

    $("material").value =
      item.material || "";

    $("length").value =
      item.length || "";

    $("weight").value =
      item.weight || "";

    $("history").value =
      item.history || "";

    $("memo").value =
      item.memo || "";

    if(item.photo){

      $("preview").src =
        item.photo;

      $("preview")
        .style.display =
        "block";

    }else{

      $("preview")
        .style.display =
        "none";
    }

    modal.classList.add(
      "show"
    );

    document.body.style
      .overflow = "hidden";
  };

window.deleteItem =
  function(id){

    if(
      !confirm(
        "このアイテムを削除しますか？"
      )
    ){
      return;
    }

    items =
      items.filter(
        x =>
        x.id !== id
      );

    saveStorage();
    render();
  };

$("search")
  .addEventListener(
    "input",
    render
  );

$("filterType")
  .addEventListener(
    "change",
    render
  );

$("filterBrand")
  .addEventListener(
    "change",
    render
  );

modal.addEventListener(
  "click",
  event => {

    if(
      event.target === modal
    ){
      closeModal();
    }
  }
);

render();

</script>

</body>
</html>
